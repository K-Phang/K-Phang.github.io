site_name: EGR 314 K Phang Data Sheet
site_url: https://k-phang.github.io/
repo_url: https://github.com/K-Phang/K-Phang.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: blue
    accent: indigo
  font:
    text: Roboto
  logo: static/logo314.svg
  favicon: static/logo314.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer

nav:
  - Home: index.md
  - Requirements: 01-Requirements/Requirements.md
  - Block Diagram: 02-Block-Diagram/Block-Diagram.md
  - Component Selection: 03-Component-Selection/Component-Selection.md
  - Power Budget: 04-Power-Budget/Power-Budget.md
  - Schematic: 05-Schematic/Schematic.md
  - BOM: 06-BOM/BOM.md
  - PCB: 07-PCB/PCB.md
  - API: 08-API/API.md
  - Hardware V2.0: 09-Hardware-V2.0/Hardware-V2.0.md
  - Resources: 10-Resources/Resources.md
  - Reflection: 11-Reflection/Reflection.md

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  static
  Appendix

copyright: "Copyright &copy; 2026 K Phang"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2026_spring
      name: 2026 Site
